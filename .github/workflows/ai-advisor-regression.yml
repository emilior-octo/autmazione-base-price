name: Valsport personalization regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated regression suite
        run: node --test tests/ai-advisor-core.test.mjs tests/compatibility-regression.test.mjs tests/advisor-catalog-refresh.test.mjs
