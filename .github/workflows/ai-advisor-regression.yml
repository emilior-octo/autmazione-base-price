name: Valsport personalization regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production SSR external module path
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('app/routes/api.advisor.proxy.compatibility.ts','utf8');if(!s.includes('process.cwd()+\"/app/lib/ai-advisor/technical-compatibility.cjs\"'))process.exit(1);require(process.cwd()+'/app/lib/ai-advisor/technical-compatibility.cjs');"
      - name: Run isolated regression suite
        run: node --test tests/ai-advisor-core.test.mjs tests/compatibility-regression.test.mjs tests/advisor-catalog-refresh.test.mjs
